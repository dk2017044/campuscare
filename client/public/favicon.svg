<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="55%" stop-color="#0050D6"/>
      <stop offset="100%" stop-color="#00359E"/>
    </linearGradient>

    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldOuterGrad" x1="256" y1="90" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2EEFF"/>
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldInnerGrad" x1="256" y1="140" x2="256" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0042BD"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="100" y="70" width="312" height="370" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001F5C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Translucent Highlight Rim -->
  <rect x="24" y="24" width="464" height="464" rx="120" stroke="white" stroke-opacity="0.22" stroke-width="8"/>

  <!-- Outer Protective Shield (White Solid) -->
  <g filter="url(#shadowFilter)">
    <path d="M256 92 C336 92 388 132 388 132 C388 268 322 380 256 420 C190 380 124 268 124 132 C124 132 176 92 256 92 Z" fill="url(#shieldOuterGrad)"/>
  </g>

  <!-- Inner Royal Blue Shield -->
  <path d="M256 132 C312 132 352 162 352 162 C352 266 304 350 256 384 C208 350 160 266 160 162 C160 162 200 132 256 132 Z" fill="url(#shieldInnerGrad)"/>

  <!-- Central Care & Protection Cross (Crisp White) -->
  <path d="M256 190 V314" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
  <path d="M194 252 H318" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>

  <!-- Central Security Star Accent (Glow) -->
  <circle cx="256" cy="252" r="10" fill="#E2EEFF"/>
</svg>